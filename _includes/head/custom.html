<style>
/* --- 1. 読書進捗バーのスタイル --- */
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 4px;
    background: #0366d6;
    width: 0%;
    z-index: 9999;
    transition: width 0.1s ease;
  }
  
  /* --- 2. トップへ戻るボタンのスタイル --- */
  #back-to-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #24292e;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 999;
    font-size: 14px;
  }
  #back-to-top.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* --- 3. 画像拡大表示のスタイル --- */
  .page__content img {
    cursor: zoom-in;
    transition: opacity 0.2s ease;
  }
  #image-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    cursor: zoom-out;
  }
  #image-modal.active {
    opacity: 1;
    visibility: visible;
  }
  #image-modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  /* --- 4. レトロRPG風プロフィールリンク（※ここを修正しました） --- */
  .author__urls li a {
    display: block;
    background-color: #111111; /* 黒いウィンドウ背景 */
    border: 2px solid #333333; /* 黒い重厚な枠線 */
    color: #dddddd !important;
    padding: 8px 12px;
    margin-bottom: 8px;
    text-decoration: none !important;
    font-family: 'Courier New', Courier, monospace; /* レトロな等幅フォント */
    box-shadow: 2px 2px 0px #000000; /* ドット絵風の影 */
    transition: background-color 0.1s, border-color 0.1s;
  }

  /* マウスを乗せたときのスタイル */
  .author__urls li a:hover {
    background-color: #1a1a1a;
    border-color: #ffcc00; /* ゴールド系の枠 */
    color: #ffffff !important;
  }

/* 3. ホバー時に左側に「▷」を出現させる設定（修正版） */
.author__urls li a {
  /* リンク自体をflexboxにして中身を中央揃えにする */
  display: flex;
  align-items: center; /* これでテキストと▷が常に縦中央に並ぶ */
  /* 以前の padding: 8px 12px; は flex で制御するため不要になります */
  padding: 8px 12px; /* 上下のパディングはそのまま維持します */
  /* text-decoration はそのまま */
}

/* ▷（矢印）の基本設定 */
.author__urls li a::before {
  content: "▷ "; /* 通常時からスペースを確保するため、ここに▷を入れておきます */
  opacity: 0;    /* 通常時は透明にして見えなくする */
  color: #ffcc00;
  font-weight: bold;
  margin-right: 0; /* flexで間隔を調整するため margin は不要 */
  
  /* サイズの固定（レイアウトが崩れないようにするため） */
  width: 0;
  overflow: hidden;
  transition: opacity 0.2s, width 0.2s; /* スムーズに表示するアニメーション */
}

/* マウスを乗せたときの「▷」の設定 */
.author__urls li a:hover::before {
  opacity: 1; /* パッと表示する */
  width: 1.5em; /* ▷の分のスペースを確保（文字が右に押し出される） */
}
  /* 埋め込みマップのスタイル調整 */
  #blog-map {
    width: 100%;
    height: 400px;
    border-radius: 8px;
    margin: 20px 0;
    z-index: 1;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // --- 1. 読書進捗バーの処理 ---
  const progress = document.createElement("div");
  progress.id = "reading-progress";
  document.body.appendChild(progress);

  window.addEventListener("scroll", () => {
    const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const scrolled = (winScroll / height) * 100;
    progress.style.width = scrolled + "%";
  });

  // --- 2. トップへ戻るボタンの処理 ---
  const btn = document.createElement("button");
  btn.id = "back-to-top";
  btn.innerHTML = "▲";
  btn.title = "トップへ戻る";
  document.body.appendChild(btn);

  const toggleButton = () => {
    if (window.scrollY > 100) {
      btn.classList.add("show");
    } else {
      btn.classList.remove("show");
    }
  };
  window.addEventListener("scroll", toggleButton);
  toggleButton();

  btn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // --- 3. 画像拡大表示の処理 ---
  const modal = document.createElement("div");
  modal.id = "image-modal";
  const modalImg = document.createElement("img");
  modal.appendChild(modalImg);
  document.body.appendChild(modal);

  const images = document.querySelectorAll(".page__content img");
  images.forEach(img => {
    img.addEventListener("click", () => {
      modalImg.src = img.src;
      modal.classList.add("active");
    });
  });

  modal.addEventListener("click", () => {
    modal.classList.remove("active");
  });
});
</script>
